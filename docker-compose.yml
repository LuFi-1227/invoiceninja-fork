services:
  app:
    image: invoiceninja/invoiceninja-debian:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ASAAS_AUTO_SYNC_CARD_EXPENSES=${ASAAS_AUTO_SYNC_CARD_EXPENSES:-true}
      - ASAAS_CARD_SYNC_DAYS=${ASAAS_CARD_SYNC_DAYS:-30}
    volumes:
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./lang:/var/www/html/lang
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./public:/var/www/html/public
      - ./docker/php.ini:/usr/local/etc/php/conf.d/invoiceninja.ini:ro
      - ./docker/init.sh:/usr/local/bin/init.sh:ro
      - ./docker/programs.conf:/etc/supervisor/conf.d/programs.conf:ro
      - ./docker/supervisord.conf:/etc/supervisor/supervisord.conf:ro
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - invoiceninja

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx:/etc/nginx/conf.d:ro
      - ./public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - invoiceninja

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ninja}
      MYSQL_USER: ${DB_USERNAME:-ninja}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ninja_secret_pwd}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ninja_root_secret_pwd}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u$${MYSQL_USER}",
          "-p$${MYSQL_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - invoiceninja

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - invoiceninja

volumes:
  app_storage:
    driver: local
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  invoiceninja:
    driver: bridge
