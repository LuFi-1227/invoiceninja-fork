server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;

    index index.php index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Fingerprinted JS/CSS/font build assets: content hashed, so they can be
    # cached forever. A missing one must return a real 404 instead of the HTML
    # front controller. If the HTML shell is served for a missing module the
    # browser aborts with
    # "Failed to load module script ... MIME type text/html".
    location ~* \.(?:js|mjs|css|map|woff2?|ttf|eot|otf)$ {
        try_files $uri =404;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Images are not fingerprinted (logos, favicons), so let the browser
    # revalidate them and never fall back to the HTML front controller.
    location ~* \.(?:svg|png|jpe?g|gif|ico|webp|avif)$ {
        try_files $uri =404;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /robots.txt  { access_log off; log_not_found off; }

    # The HTML shell (rendered by PHP) must never be cached, otherwise a deploy
    # keeps the browser pointing at old fingerprinted chunks.
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
